; === Fork custom envs: solar telemetry repeater, WiFi/MQTT bridge repeater, dual
; USB+BLE companion. Previously lived in a separate variants/heltec_v4_custom/
; directory; merged in here so every Heltec V4 build shows up under one env-name
; family for the release matrix and the flasher.
;
; NAMING: repeater envs MUST end in "_repeater" and companion envs in
; "_companion_radio_ble" - build.sh picks release targets with
; get_pio_envs_ending_with_string(), a suffix match, not a substring one.

[env:heltec_v4_solar_repeater]
extends = heltec_v4_oled
build_flags =
  ${heltec_v4_oled.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Heltec Solar Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  ; INA3221 current monitor: 2 channels wired (CH1 panel, CH2 charge). CH3
  ; unused, so only query 2 to avoid emitting a junk "load" channel.
  ; Our module straps A0->GND, so it answers on 0x40 (driver default is 0x42).
  ; 0x40 is ALSO the INA219 table entry, and Adafruit_INA219::begin() does not
  ; verify the chip ID - it would claim 0x40 first and report one bogus channel
  ; of zeros. So INA219 must be disabled for this build.
  ; Shunt stays at the driver default 0.1 ohm (~1.6 A full scale); use
  ; -D TELEM_INA3221_SHUNT_VALUE=0.05 if the physical module differs.
  -D TELEM_INA3221_ADDRESS=0x40
  -D ENV_INCLUDE_INA219=0
  -D TELEM_INA3221_NUM_CHANNELS=2
  ; label 'sensor read' current channels by role (panel/chg/load) instead of chN
  -D SENSOR_CURRENT_ROLE_LABELS=1
  ; boot I2C bus dump (I2CSCAN lines) + per-sensor detection logs
  -D MESH_DEBUG=1
build_src_filter = ${heltec_v4_oled.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${heltec_v4_oled.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:heltec_v4_wifi_mqtt_repeater]
extends = heltec_v4_oled
build_flags =
  ${heltec_v4_oled.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Heltec WiFi Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -I examples/simple_repeater
  -D ARDUINO_USB_MODE=1
  ; INA3221 current monitor: 2 channels wired (CH1 panel, CH2 charge). CH3
  ; unused, so only query 2 to avoid emitting a junk "load" channel.
  ; Our module straps A0->GND, so it answers on 0x40 (driver default is 0x42).
  ; 0x40 is ALSO the INA219 table entry, and Adafruit_INA219::begin() does not
  ; verify the chip ID - it would claim 0x40 first and report one bogus channel
  ; of zeros. So INA219 must be disabled for this build.
  ; Shunt stays at the driver default 0.1 ohm (~1.6 A full scale); use
  ; -D TELEM_INA3221_SHUNT_VALUE=0.05 if the physical module differs.
  -D TELEM_INA3221_ADDRESS=0x40
  -D ENV_INCLUDE_INA219=0
  -D TELEM_INA3221_NUM_CHANNELS=2
  ; label 'sensor read' current channels by role (panel/chg/load) instead of chN
  -D SENSOR_CURRENT_ROLE_LABELS=1
  ; boot I2C bus dump (I2CSCAN lines) + per-sensor detection logs
  -D MESH_DEBUG=1
  ; --- network services ---
  -D WITH_NET_SERVICES=1
  -D TCP_CLI_PORT=5000
  -D TELEMETRY_INTERVAL_SECS=60
  -D MQTT_BASE_TOPIC='"meshcore"'
  -D WIFI_SSID='"changeme"'
  -D WIFI_PWD='"changeme"'
  -D MQTT_HOST='"192.168.1.10"'
  -D MQTT_PORT=1883
  -D MQTT_USER='"mesh"'
  -D MQTT_PWD='"changeme"'
build_unflags = -DARDUINO_USB_MODE=0
build_src_filter = ${heltec_v4_oled.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/net/*.cpp>
  +<../examples/repeater_net>
  +<../examples/simple_repeater/MyMesh.cpp>
  +<../examples/simple_repeater/UITask.cpp>
lib_deps =
  ${heltec_v4_oled.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0
  knolleary/PubSubClient @ ^2.8

[env:heltec_v4_usb_companion_radio_ble]
extends = env:heltec_v4_companion_radio_ble
build_flags =
  ${env:heltec_v4_companion_radio_ble.build_flags}
  -D ENABLE_USB_INTERFACE=1
  ; native USB (HWCDC) so the USB interface can actually detect the USB host
  ; connection state instead of always reporting connected
  -D ARDUINO_USB_MODE=1
build_unflags = -DARDUINO_USB_MODE=0
