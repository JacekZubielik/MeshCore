  +<../examples/kiss_modem/>

; === Fork: OLED 0x3D address + dual USB+BLE transport, combined with upstream roles ===
; Units fitted with the QMC6310N magnetometer force the OLED to 0x3D (0x3C is taken
; by the magnetometer). Hardware is otherwise identical to the stock variant above, so
; these envs extend it and only add the two modifier flags below. Previously lived in a
; separate variants/lilygo_tbeam_supreme_SX1262_oled0x3D/ directory; merged in here so
; every T-Beam Supreme build shows up under one env-name family for the release matrix
; and the flasher.

[T_Beam_S3_Supreme_SX1262_oled0x3D]
extends = T_Beam_S3_Supreme_SX1262
build_flags =
  ${T_Beam_S3_Supreme_SX1262.build_flags}
  -D DISPLAY_ADDRESS=0x3D

[T_Beam_S3_Supreme_SX1262_usb_ble]
extends = T_Beam_S3_Supreme_SX1262
build_flags =
  ${T_Beam_S3_Supreme_SX1262.build_flags}
  -D ENABLE_USB_INTERFACE=1

; NOTE: multi-parent `extends` does NOT union lib_deps/build_src_filter across
; parents - PlatformIO takes only the last-listed parent's resolved value for any
; key the child doesn't redeclare. Every key that differs between the role parent
; (env:..._repeater etc.) and the modifier parent (_oled0x3D/_dual, which only
; inherit the plain HW base) must be explicitly re-merged here, not just build_flags.

[env:T_Beam_S3_Supreme_SX1262_oled0x3D_repeater]
extends =
  env:T_Beam_S3_Supreme_SX1262_repeater
  T_Beam_S3_Supreme_SX1262_oled0x3D
build_flags =
  ${env:T_Beam_S3_Supreme_SX1262_repeater.build_flags}
  ${T_Beam_S3_Supreme_SX1262_oled0x3D.build_flags}
build_src_filter = ${env:T_Beam_S3_Supreme_SX1262_repeater.build_src_filter}
lib_deps = ${env:T_Beam_S3_Supreme_SX1262_repeater.lib_deps}

[env:T_Beam_S3_Supreme_SX1262_oled0x3D_room_server]
extends =
  env:T_Beam_S3_Supreme_SX1262_room_server
  T_Beam_S3_Supreme_SX1262_oled0x3D
build_flags =
  ${env:T_Beam_S3_Supreme_SX1262_room_server.build_flags}
  ${T_Beam_S3_Supreme_SX1262_oled0x3D.build_flags}
build_src_filter = ${env:T_Beam_S3_Supreme_SX1262_room_server.build_src_filter}
lib_deps = ${env:T_Beam_S3_Supreme_SX1262_room_server.lib_deps}

[env:T_Beam_S3_Supreme_SX1262_oled0x3D_companion_radio_ble]
extends =
  env:T_Beam_S3_Supreme_SX1262_companion_radio_ble
  T_Beam_S3_Supreme_SX1262_oled0x3D
build_flags =
  ${env:T_Beam_S3_Supreme_SX1262_companion_radio_ble.build_flags}
  ${T_Beam_S3_Supreme_SX1262_oled0x3D.build_flags}
build_src_filter = ${env:T_Beam_S3_Supreme_SX1262_companion_radio_ble.build_src_filter}
lib_deps = ${env:T_Beam_S3_Supreme_SX1262_companion_radio_ble.lib_deps}

[env:T_Beam_S3_Supreme_SX1262_oled0x3D_usb_companion_radio_ble]
extends =
  env:T_Beam_S3_Supreme_SX1262_companion_radio_ble
  T_Beam_S3_Supreme_SX1262_oled0x3D
  T_Beam_S3_Supreme_SX1262_usb_ble
build_flags =
  ${env:T_Beam_S3_Supreme_SX1262_companion_radio_ble.build_flags}
  ${T_Beam_S3_Supreme_SX1262_oled0x3D.build_flags}
  ${T_Beam_S3_Supreme_SX1262_usb_ble.build_flags}
build_src_filter = ${env:T_Beam_S3_Supreme_SX1262_companion_radio_ble.build_src_filter}
lib_deps = ${env:T_Beam_S3_Supreme_SX1262_companion_radio_ble.lib_deps}

[env:T_Beam_S3_Supreme_SX1262_usb_companion_radio_ble]
extends =
  env:T_Beam_S3_Supreme_SX1262_companion_radio_ble
  T_Beam_S3_Supreme_SX1262_usb_ble
build_flags =
  ${env:T_Beam_S3_Supreme_SX1262_companion_radio_ble.build_flags}
  ${T_Beam_S3_Supreme_SX1262_usb_ble.build_flags}
build_src_filter = ${env:T_Beam_S3_Supreme_SX1262_companion_radio_ble.build_src_filter}
lib_deps = ${env:T_Beam_S3_Supreme_SX1262_companion_radio_ble.lib_deps}
