; Heltec V4 - fork custom profiles (overlay).
; Keeps the upstream variants/heltec_v4/ directory pristine: this file only adds
; our own build environment, which inherits the upstream hardware base
; (heltec_v4_oled) via cross-file `extends`. Auto-included by
; `extra_configs = variants/*/platformio.ini`. Flash by selecting the env.

[env:heltec_v4_repeater_wifi_mqtt]
extends = heltec_v4_oled
build_flags =
  ${heltec_v4_oled.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Heltec WiFi Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -I examples/simple_repeater
  -D ARDUINO_USB_MODE=1
  ; INA3221 current monitor: 2 channels wired (CH1 panel, CH2 charge). CH3
  ; unused, so only query 2 to avoid emitting a junk "load" channel. Address
  ; 0x42 and 0.1 ohm shunt are the driver defaults; override here if the
  ; physical module differs (e.g. -D TELEM_INA3221_SHUNT_VALUE=0.05).
  -D TELEM_INA3221_NUM_CHANNELS=2
  ; label 'sensor read' current channels by role (panel/chg/load) instead of chN
  -D SENSOR_CURRENT_ROLE_LABELS=1
  ; --- network services ---
  -D WITH_NET_SERVICES=1
  -D TCP_CLI_PORT=5000
  -D TELEMETRY_INTERVAL_SECS=60
  -D MQTT_BASE_TOPIC='"meshcore"'
  -D WIFI_SSID='"changeme"'
  -D WIFI_PWD='"changeme"'
  -D MQTT_HOST='"192.168.1.10"'
  -D MQTT_PORT=1883
  -D MQTT_USER='"mesh"'
  -D MQTT_PWD='"changeme"'
build_unflags = -DARDUINO_USB_MODE=0
build_src_filter = ${heltec_v4_oled.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/net/*.cpp>
  +<../examples/repeater_net>
  +<../examples/simple_repeater/MyMesh.cpp>
  +<../examples/simple_repeater/UITask.cpp>
lib_deps =
  ${heltec_v4_oled.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0
  knolleary/PubSubClient @ ^2.8
