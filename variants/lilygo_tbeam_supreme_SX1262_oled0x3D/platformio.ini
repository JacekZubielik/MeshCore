; LilyGo T-Beam S3 Supreme (SX1262) - boards with OLED at I2C 0x3D.
; The OLED address is forced to 0x3D on units fitted with the QMC6310N
; magnetometer (which occupies 0x3C). Hardware is otherwise identical to the
; stock variant, so these profiles inherit it and only override DISPLAY_ADDRESS.
; Flash by selecting the env - no extra build flags required.
; Auto-included by `extra_configs = variants/*/platformio.ini`.

[env:TBeam_Supreme_oled0x3D_companion_ble]
extends = env:T_Beam_S3_Supreme_SX1262_companion_radio_ble
build_flags =
  ${env:T_Beam_S3_Supreme_SX1262_companion_radio_ble.build_flags}
  -D DISPLAY_ADDRESS=0x3D
;  -D MESH_DEBUG=1   ; uncomment for boot-time I2C scan / USB-CDC debug only

[env:TBeam_Supreme_oled0x3D_repeater]
extends = env:T_Beam_S3_Supreme_SX1262_repeater
build_flags =
  ${env:T_Beam_S3_Supreme_SX1262_repeater.build_flags}
  -D DISPLAY_ADDRESS=0x3D

[env:TBeam_Supreme_oled0x3D_room_server]
extends = env:T_Beam_S3_Supreme_SX1262_room_server
build_flags =
  ${env:T_Beam_S3_Supreme_SX1262_room_server.build_flags}
  -D DISPLAY_ADDRESS=0x3D

[env:TBeam_Supreme_oled0x3D_companion_usb_ble]
extends = env:T_Beam_S3_Supreme_SX1262_companion_radio_ble
build_flags =
  ${env:T_Beam_S3_Supreme_SX1262_companion_radio_ble.build_flags}
  -D DUAL_USB_BLE=1
  -D DISPLAY_ADDRESS=0x3D
