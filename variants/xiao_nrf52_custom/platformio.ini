; XIAO nRF52840 + Wio-SX1262 - fork custom profiles (overlay).
; Keeps the upstream variants/xiao_nrf52/ directory pristine: this file only adds
; our own build environment, which inherits the upstream hardware base
; ([Xiao_nrf52]) via cross-file `extends`. Auto-included by
; `extra_configs = variants/*/platformio.ini`. Flash by selecting the env.
;
; NAMING: the env name MUST end in "_repeater". build.sh picks release targets
; with `get_pio_envs_ending_with_string "_repeater"` - a suffix match, not a
; substring one. An env named otherwise builds fine locally but is silently
; skipped by the release matrix, so its .bin never reaches a release.

[env:Xiao_nrf52_custom_repeater]
extends = Xiao_nrf52
build_flags =
  ${Xiao_nrf52.build_flags}
  -D ADVERT_NAME='"Xiao_nrf52 Solar Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  ; WCMCU-226 (INA226) in the solar panel line, factory address 0x40. The
  ; driver default is 0x44, and 0x40 is the INA219 probe entry -
  ; Adafruit_INA219::begin() does not verify the chip ID, so it would claim
  ; the INA226 first and report bogus values. INA219 must be disabled here.
  ; Shunt stays at the driver default 0.1 ohm (0.82 A full scale) - enough
  ; for a 12 V / 8 W panel (Isc ~0.5 A).
  -D TELEM_INA226_ADDRESS=0x40
  -UENV_INCLUDE_INA219
  ; label 'sensor read' V/I/P channels by role: the single INA226 -> "panel"
  -D SENSOR_CURRENT_ROLE_LABELS=1
  ; boot I2C bus dump (I2CSCAN lines) + per-sensor detection logs
  -D MESH_DEBUG=1
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
